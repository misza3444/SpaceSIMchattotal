name: Ship Screenshot

on:
  push:
    paths:
      - .github/workflows/ship-screenshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run game and capture ship screenshot
        run: |
          set -e
          npm run dev -- --host 127.0.0.1 > /tmp/spacesim-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          which google-chrome || true
          google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=6000 --screenshot=spacesim-ship.png http://127.0.0.1:5173/ 2>&1 | tail -30
          test -s spacesim-ship.png
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('spacesim-ship.png').convert('RGB')
          im.thumbnail((1024,720))
          im.save('spacesim-ship.webp', quality=70)
          PY
          echo 'SHIP_SCREENSHOT_BASE64_BEGIN'
          base64 -w0 spacesim-ship.webp
          echo
          echo 'SHIP_SCREENSHOT_BASE64_END'
      - name: Upload original screenshot
        uses: actions/upload-artifact@v4
        with:
          name: spacesim-ship-stage1
          path: |
            spacesim-ship.png
            spacesim-ship.webp
          retention-days: 7
      - name: Publish screenshot to repository
        run: |
          mkdir -p docs/screenshots
          cp spacesim-ship.png docs/screenshots/ship-stage1.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/ship-stage1.png
          git commit -m 'docs: add actual browser screenshot of Stage 1 ship'
          git push origin HEAD:main
