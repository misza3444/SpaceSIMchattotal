name: SpaceSIM Art Pass 4 Preview
on:
  push:
    paths:
      - '.github/workflows/art-pass-previews.yml'
      - 'src/render/scene.ts'
      - 'src/render/station.ts'
      - 'src/render/vanguard.ts'
      - 'src/render/pbr-materials.ts'
      - 'src/render/ship-library.ts'
  workflow_dispatch:
concurrency:
  group: space-art-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: npm install --no-audit --no-fund
      - name: Capture PBR GLBs and the modular space station
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          npm run dev -- --host 127.0.0.1 > /tmp/space-vite.log 2>&1 &
          for n in $(seq 1 45); do
            if curl -fs http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          for ship in proteron-a proteron-b vanguard; do
            google-chrome --headless --no-sandbox --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=9000 --screenshot="docs/screenshots/ship-$ship-artpass4.png" "http://127.0.0.1:5173/?ship=$ship" >"/tmp/space-$ship-chrome.log" 2>&1
            test -s "docs/screenshots/ship-$ship-artpass4.png"
            echo "CAPTURED $ship $(wc -c <"docs/screenshots/ship-$ship-artpass4.png") bytes"
          done
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          for ship in ('proteron-a', 'proteron-b', 'vanguard'):
              image=Image.open(f'docs/screenshots/ship-{ship}-artpass4.png').convert('RGB')
              image.thumbnail((1024,720))
              image.save(f'/tmp/{ship}.webp',quality=67)
          PY
          for ship in proteron-a proteron-b vanguard; do
            echo "SHIP_$ship-BASE64-BEGIN"
            base64 -w0 "/tmp/$ship.webp"
            echo
            echo "SHIP_$ship-BASE64-END"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: spacesim-artpass4-ship-comparison
          path: docs/screenshots/ship-*-artpass4.png
          retention-days: 14
      - name: Publish preview PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/ship-proteron-a-artpass4.png docs/screenshots/ship-proteron-b-artpass4.png docs/screenshots/ship-vanguard-artpass4.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: capture Proteron ships and Vanguard in browser'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
