name: Vendor Poly Haven PBR Maps
on:
  push:
    paths:
      - '.github/workflows/import-pbr-materials.yml'
      - 'scripts/fetch-pbr-materials.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify PNG texture maps
        run: python scripts/fetch-pbr-materials.py
      - name: Publish CC0 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/materials
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: add local CC0 Poly Haven PBR materials"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
