name: Import Real Proteron GLB Ships
on:
  push:
    paths:
      - '.github/workflows/import-proteron-ships.yml'
      - 'scripts/import-proteron.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, inspect and validate two licensed GLBs
        run: python scripts/import-proteron.py
      - name: Publish binary ships and source manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ships/proteron-*.glb public/assets/ships/proteron-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: import two original PBR spacecraft by Viktor Hahn (CC BY 4.0)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
